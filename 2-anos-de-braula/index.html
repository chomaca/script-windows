  :root {
    color-scheme: light;
    --blush: #FFE3EE;
    --blush-2: #FFC9DD;
    --peach: #FFE1C4;
    --lilac: #EAD9FF;
    --berry: #5A0A2E;
    --raspberry: #C2185B;
    --cherry: #E0144C;
    --pink: #FF3D7F;
    --gold: #FFB627;
    --violet: #8C52FF;
    --coral: #FF6B4A;
    --teal: #12A594;
    --white: #FFFFFF;
    --paper: #FFFDF7;
    --undeveloped: #4B535C;
    --display: "Shrikhand", "Georgia", serif;
    --round: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --wheel: min(86vw, 44vh, 440px);
    --wheel: min(86vw, 44svh, 440px);
  }
  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; min-height: 100%; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  body {
    background:
      radial-gradient(circle at 12% 18%, var(--blush-2) 0 20%, transparent 45%),
      radial-gradient(circle at 90% 10%, var(--peach) 0 16%, transparent 42%),
      radial-gradient(circle at 86% 88%, var(--lilac) 0 18%, transparent 46%),
      radial-gradient(circle at 8% 92%, var(--peach) 0 12%, transparent 38%),
      var(--blush);
    background-color: var(--blush);
    color: var(--berry);
    font-family: var(--round);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ---------- background: polaroids + hearts ---------- */
  .gallery, .sky, .fx, .dim {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .gallery, .sky { z-index: 0; }
  .dim { z-index: 1; }
  .fx { z-index: 20; }

  .polaroid {
    position: absolute;
    top: 0;
    left: var(--x);
    width: var(--w);
    padding: calc(var(--w) * .06) calc(var(--w) * .06) calc(var(--w) * .2);
    background: var(--paper);
    box-shadow: 0 2px 3px rgba(90, 10, 46, .14), 0 16px 30px rgba(90, 10, 46, .24);
    animation: fall var(--d) linear var(--delay) infinite;
    will-change: transform;
  }
  .polaroid .pic {
    position: relative;
    height: calc(var(--w) * .88);   /* square photo inside the 6% frame */
    overflow: hidden;
    background: var(--undeveloped);
  }
  .polaroid img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* the photo "develops" as it enters the screen, like a real polaroid */
  .polaroid .pic::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--undeveloped);
    opacity: 0;
    animation: develop var(--d) linear var(--delay) infinite;
  }
  .polaroid > svg {
    position: absolute;
    left: 50%;
    bottom: calc(var(--w) * .045);
    width: calc(var(--w) * .11);
    height: calc(var(--w) * .11);
    transform: translateX(-50%);
    fill: var(--c);
  }
  @keyframes fall {
    0%   { transform: translate(-50%, -115%) rotate(var(--r1)); }
    50%  { transform: translate(calc(-50% + var(--drift)), calc(50vh - 50%)) rotate(var(--r2)); }
    100% { transform: translate(-50%, 100vh) rotate(var(--r1)); }
  }
  @keyframes develop {
    0%, 5% { opacity: .96; }
    24%    { opacity: 0; }
    100%   { opacity: 0; }
  }

  .float {
    position: absolute;
    bottom: -70px;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    color: var(--c);
    opacity: var(--o);
    animation: rise var(--d) linear var(--delay) infinite;
  }
  .float svg, .fx svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  .float svg { animation: sway 3.2s ease-in-out infinite alternate; }
  @keyframes rise {
    from { transform: translateY(0) rotate(var(--r)); }
    to   { transform: translateY(calc(-100vh - 140px)) rotate(calc(var(--r) * -1)); }
  }
  @keyframes sway {
    from { transform: translateX(-16px); }
    to   { transform: translateX(16px); }
  }
  .fx > span { position: absolute; display: block; }
  .fx > .flash { top: 0; right: 0; bottom: 0; left: 0; background: var(--white); }

  /* spotlight while the wheel spins */
  .dim {
    opacity: 0;
    transition: opacity 1.2s ease;
    background: radial-gradient(circle at 50% 56%, rgba(90, 10, 46, 0) 0 24%, rgba(90, 10, 46, .6) 78%);
  }
  body.suspense .dim { opacity: 1; }

  /* ---------- layout ---------- */
  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vh, 22px);
    gap: clamp(8px, 1.8svh, 22px);
    padding-inline: 16px;
    padding-block: 20px 32px;
    text-align: center;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: clip;   /* nothing inside may widen the page on a phone */
  }
  header { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .since, .ask {
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .8);
    box-shadow: 0 4px 14px rgba(90, 10, 46, .12);
  }
  .since {
    padding: 5px 14px;
    color: var(--raspberry);
    font-weight: 600;
    font-size: .9rem;
    letter-spacing: .08em;
    font-variant-numeric: tabular-nums;
  }
  .since svg { width: 14px; height: 14px; fill: var(--cherry); }
  /* the date doubles as the secret handle (press and hold) */
  .since { touch-action: none; -webkit-touch-callout: none; }
  .ask {
    padding: 6px 18px;
    font-weight: 600;
    font-size: clamp(1.05rem, 3.6vw, 1.3rem);
  }

  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.3rem, 9vw, 4.4rem);
    line-height: 1;
    color: var(--cherry);
    text-wrap: balance;
    text-shadow: 3px 3px 0 var(--white), 6px 6px 0 rgba(90, 10, 46, .16);
  }
  h1 .l1, h1 .l2, h1 .l3, h1 .l4, h1 .l5, h1 .l6 {
    display: inline-block;
    animation: hop .8s cubic-bezier(.3, 1.7, .5, 1) both;
  }
  h1 .l1 { animation-delay: .30s; }
  h1 .l2 { animation-delay: .37s; }
  h1 .l3 { animation-delay: .44s; }
  h1 .l4 { animation-delay: .51s; }
  h1 .l5 { animation-delay: .58s; }
  h1 .l6 { animation-delay: .65s; }
  header > * { animation: drop-in .7s cubic-bezier(.25, 1.4, .45, 1) both; }
  header > h1 { animation-delay: .06s; }
  header > .ask { animation-delay: .12s; }
  @keyframes drop-in { from { translate: 0 -14px; } to { translate: 0 0; } }

  h1 .l1 { color: var(--pink); }

  /* ---------- the five restaurants, same colours as the wheel ---------- */
  .chips {

  .chip {

  /* ---------- big button ---------- */
  .spin {

  .result {

  .ok {
    padding: .55em 1.6em;

    font-family: var(--round);

  /* ---------- opening screen: the tap that opens it is the tap that lets the music play ---------- */
  .splash {
    position: fixed;

    flex-direction: column;
    align-items: center;
    justify-content: center;

  main { transition: opacity .7s ease; }

  .ask-card {

    <h1>2 anos de <span class="name"><span class="l1">B</span><span class="l2">r</span><span class="l3">a</span><span class="l4">u</span><span class="l5">l</span><span class="l6">a</span></span></h1>

  <!-- role="list" on purpose: Safari/VoiceOver drops list semantics when bullets are hidden -->

      </div>

        <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4 7 4c2.2 0 3.8 1.2 5 3 1.2-1.8 2.8-3 5-3 4.1 0 6.1 4.4 4.6 7.8C19.5 16.4 12 21 12 21z"/>
      </clipPath>
      <use class="blush" href="#heart"/>
      <image href="fotos/coracao.jpg" x="1" y="2.6" width="22" height="22" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)"/>

<div class="fx" id="fx" aria-hidden="true"></div>

<!-- Which restaurants are on the wheel. The secret panel rewrites this block when it saves for everyone. -->
<script type="application/json" id="wheelConfig">{"removed":[],"ts":0}</script>

<script>
(() => {
  const RESTAURANTS = [
    { name: "Mocellin",      lines: ["Mocellin"],         color: "#8A5A34", ink: "#FFFFFF", text: "#7A4A26" },  // marrom
    { name: "San",           lines: ["San"],              color: "#FF7A1A", ink: "#3B0A1F", text: "#E25E00" },  // laranja
    { name: "Don Burizin",   lines: ["Don", "Burizin"],   color: "#7C3AED", ink: "#FFFFFF", text: "#7C3AED" },  // roxo
    { name: "Yusha",         lines: ["Yusha"],            color: "#15803D", ink: "#FFFFFF", text: "#15803D" },  // verde
    { name: "Malta",         lines: ["Malta"],            color: "#1F1A1C", ink: "#FFFFFF", text: "#1F1A1C" },  // preto
  ];
  const PHOTOS = ["fotos/1.jpg", "fotos/2.jpg", "fotos/3.jpg", "fotos/4.jpg", "fotos/5.jpg"];
  const HEART_COLORS = ["#FF3D7F", "#E0144C", "#FFB627", "#8C52FF", "#FF6B4A", "#12A594", "#FFFFFF", "#FF3D7F", "#C2185B", "#E0144C"];

  const NS = "http://www.w3.org/2000/svg";
  // The restaurants on the wheel right now (the secret panel can take some out).
  // Every slice is always the same size, so each one has exactly 1 in N.
  let active = RESTAURANTS.slice();
  let N = active.length;
  let SLICE = 360 / N;
  let PEG = SLICE / 4;       // a soft click every quarter slice, a louder one on each divider
  const C = 200;
  const R_SEG = 172;
  const reduce = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  const $ = (id) => document.getElementById(id);
  const disc = $("disc"), bulbs = $("bulbs"), wheel = $("wheel"), discSpin = $("discSpin");
  const pointer = $("pointer"), spinBtn = $("spin"), spinLabel = $("spinLabel");
  const result = $("result"), resultName = $("resultName"), ok = $("ok"), live = $("live"), resultFx = $("resultFx");
  const gallery = $("gallery"), sky = $("sky"), fx = $("fx");

  // ---------- randomness ----------
  // Uniform integer in [0, n): rejection sampling removes the tiny modulo bias,
  // so each restaurant has exactly 1 in n.
  function randInt(n) {
    try {
      const buf = new Uint32Array(1);
      const limit = Math.floor(4294967296 / n) * n;
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    } catch (e) {
      return Math.floor(Math.random() * n);
    }
  }
  function rand() {
    try {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] / 4294967296;
    } catch (e) {
      return Math.random();
    }
  }
  const pick = (arr) => arr[randInt(arr.length)];
  const mod = (a, n) => ((a % n) + n) % n;
  const easeInOutSine = (u) => -(Math.cos(Math.PI * u) - 1) / 2;
  const easeOutCubic = (u) => 1 - Math.pow(1 - u, 3);

  function svgEl(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function heartSvg() {
    const s = svgEl("svg", { viewBox: "0 0 24 24" });
    svgEl("use", { href: "#heart" }, s);
    return s;
  }
  // angle in degrees, clockwise from 12 o'clock
  function pt(r, deg) {
    const a = deg * Math.PI / 180;
    return [C + r * Math.sin(a), C - r * Math.cos(a)];
  }

  // ---------- build the wheel ----------
  const chipsBox = $("chips"), rowHearts = $("rowHearts");
  let segs = [], chipEls = [];
  function buildWheel() {
    N = active.length;
    SLICE = 360 / N;
    PEG = SLICE / 4;
    disc.textContent = "";
    chipsBox.textContent = "";
    rowHearts.textContent = "";
    wheel.classList.remove("has-win");
    chipsBox.classList.remove("has-win");
    wheel.setAttribute("aria-label", "Roleta com " + active.map((r) => r.name).join(", ").replace(/, ([^,]*)$/, " e $1"));
    segs = active.map(buildSlice);
    // the names, readable before spinning
    chipEls = active.map((r) => {
      const li = document.createElement("li");
      li.className = "chip";
      li.style.setProperty("--chip", r.color);
      li.style.setProperty("--chip-ink", r.ink);
      const icon = heartSvg();
      icon.setAttribute("aria-hidden", "true");
      li.appendChild(icon);
      li.appendChild(document.createTextNode(r.name));
      chipsBox.appendChild(li);
      return li;
    });
    // one small heart per restaurant on the result card
    active.forEach((r) => {
      const h = heartSvg();
      h.style.fill = r.color;
      rowHearts.appendChild(h);
    });
  }
  function buildSlice(r, i) {
    const g = svgEl("g", { class: "seg" }, disc);
    const [x1, y1] = pt(R_SEG, i * SLICE);
    const [x2, y2] = pt(R_SEG, (i + 1) * SLICE);
    svgEl("path", {
      class: "slice",
      fill: r.color,
      d: `M${C} ${C} L${x1.toFixed(2)} ${y1.toFixed(2)} A${R_SEG} ${R_SEG} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`,
    }, g);
    const mid = i * SLICE + SLICE / 2;
    const flip = mid > 180;   // left half: read from the rim inwards so the name isn't upside down
    const t = svgEl("g", { transform: `rotate(${flip ? mid + 90 : mid - 90} ${C} ${C})` }, g);
    r.lines.forEach((line, j) => {
      const y = C + (j - (r.lines.length - 1) / 2) * 23;
      const text = svgEl("text", {
        x: flip ? C - 158 : C + 158, y, dy: ".35em",
        "text-anchor": flip ? "start" : "end",
        fill: r.ink,
        class: r.ink === "#FFFFFF" ? "lbl lbl-light" : "lbl",
      }, t);
      text.textContent = line;
    });
    return g;
  }

  const BULBS = 20;
  for (let i = 0; i < BULBS; i++) {
    const g = svgEl("g", { transform: `rotate(${i * 360 / BULBS} ${C} ${C})` }, bulbs);
    svgEl("use", { href: "#heart", x: 193, y: 8, width: 14, height: 14, class: i % 2 ? "bulb odd" : "bulb" }, g);
  }

  // ---------- which restaurants are in (page config, or this device's own choice) ----------
  const STORE_KEY = "braula-roleta";
  function readConfig() {
    let cfg = { removed: [], ts: 0 };
    try { cfg = JSON.parse($("wheelConfig").textContent) || cfg; } catch (e) { /* keep defaults */ }
    try {
      const local = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (local && local.ts > (cfg.ts || 0)) cfg = local;
    } catch (e) { /* storage blocked: the page config alone decides */ }
    return cfg;
  }
  function applyConfig(cfg) {
    const removed = Array.isArray(cfg.removed) ? cfg.removed : [];
    const next = RESTAURANTS.filter((r) => !removed.includes(r.name));
    active = next.length >= 2 ? next : RESTAURANTS.slice();
    buildWheel();
  }
  applyConfig(readConfig());

  // ---------- polaroids falling in the background ----------
  const POLAROID_COLORS = ["#FF3D7F", "#FFB627", "#8C52FF", "#FF6B4A", "#12A594"];
  const DURATIONS = [34, 41, 30, 38, 45];
  const polaroids = PHOTOS.map((src, i) => {
    const card = document.createElement("div");
    card.className = "polaroid";
    const d = DURATIONS[i];
    card.style.setProperty("--d", d + "s");
    card.style.setProperty("--delay", (-((i * 0.2 + 0.08 + rand() * 0.1) % 1) * d).toFixed(1) + "s");
    card.style.setProperty("--r1", Math.round(-14 + rand() * 28) + "deg");
    card.style.setProperty("--r2", Math.round(-14 + rand() * 28) + "deg");
    card.style.setProperty("--drift", Math.round(-30 + rand() * 60) + "px");
    card.style.setProperty("--y", Math.round(4 + (i / PHOTOS.length) * 70 + rand() * 8) + "vh");
    card.style.setProperty("--c", POLAROID_COLORS[i]);
    const pic = document.createElement("div");
    pic.className = "pic";
    const img = document.createElement("img");
    img.src = src;
    img.alt = "";
    img.decoding = "async";
    pic.appendChild(img);
    card.appendChild(pic);
    card.appendChild(heartSvg());
    gallery.appendChild(card);
    return card;
  });

  // Wide screens: keep the photos in the side margins, clear of the wheel.
  // Narrow screens: spread them out and let them pass behind everything.
  function layoutPolaroids() {
    const W = window.innerWidth;
    let lanes, w;
    if (W >= 900) {
      const side = (W - 520) / 2;
      w = Math.min(200, Math.max(130, side * 0.42));
      lanes = [side * 0.28, W - side * 0.3, side * 0.74, W - side * 0.76, side * 0.5];
    } else {
      w = Math.min(130, Math.max(96, W * 0.28));
      lanes = [0.13, 0.87, 0.32, 0.7, 0.5].map((f) => f * W);
    }
    polaroids.forEach((card, i) => {
      card.style.setProperty("--x", Math.round(lanes[i]) + "px");
      card.style.setProperty("--w", Math.round(w) + "px");
    });
  }
  layoutPolaroids();
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layoutPolaroids, 150);
  });

  // ---------- fit everything on one phone screen ----------
  const main = document.querySelector("main");
  const wheelWrap = $("wheelWrap");
  const sideways = window.matchMedia("(orientation: landscape) and (max-height: 500px)");
  function fitWheel() {
    const rootCss = getComputedStyle(document.documentElement);
    const H = window.innerHeight - parseFloat(rootCss.paddingTop) - parseFloat(rootCss.paddingBottom);
    const W = document.documentElement.clientWidth;
    let size;
    if (sideways.matches) {
      size = Math.min((H - 30) / 1.06, W * 0.46, 440);
    } else {
      // everything except the wheel: header, names, button, gaps and padding
      const kids = [...main.children].filter((el) => el.offsetParent !== null && getComputedStyle(el).position !== "absolute");
      const used = kids[kids.length - 1].getBoundingClientRect().bottom - kids[0].getBoundingClientRect().top;
      const mainCss = getComputedStyle(main);
      const others = used - wheelWrap.offsetWidth * 1.06 + parseFloat(mainCss.paddingTop) + parseFloat(mainCss.paddingBottom);
      size = Math.min((H - others) / 1.06, W * 0.88, 440);
    }
    document.documentElement.style.setProperty("--wheel", Math.floor(Math.max(210, size)) + "px");
  }
  fitWheel();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitWheel);
  let fitTimer;
  window.addEventListener("resize", () => {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fitWheel, 120);
  });

  // ---------- hearts floating in the background ----------
  const FLOATS = window.innerWidth < 600 ? 18 : 40;
  for (let i = 0; i < FLOATS; i++) {
    const span = document.createElement("span");
    span.className = "float";
    const d = 9 + rand() * 11;
    span.style.setProperty("--x", (rand() * 100).toFixed(1) + "%");
    span.style.setProperty("--y", (rand() * 100).toFixed(1) + "%");
    span.style.setProperty("--s", Math.round(12 + rand() * 34) + "px");
    span.style.setProperty("--c", pick(HEART_COLORS));
    span.style.setProperty("--o", (0.4 + rand() * 0.5).toFixed(2));
    span.style.setProperty("--d", d.toFixed(1) + "s");
    span.style.setProperty("--delay", (-rand() * d).toFixed(1) + "s");
    span.style.setProperty("--r", Math.round(-25 + rand() * 50) + "deg");
    span.appendChild(heartSvg());
    sky.appendChild(span);
  }

  // ---------- effects ----------
  function flyHeart(x, y, size, color, dx, dy, rot, duration, easing, layer) {
    const span = document.createElement("span");
    span.style.cssText = `left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;color:${color}`;
    span.appendChild(heartSvg());
    (layer || fx).appendChild(span);
    if (!span.animate) { setTimeout(() => span.remove(), 600); return; }
    const a = span.animate([
      { transform: "translate(0,0) scale(.2) rotate(0deg)", opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) scale(1) rotate(${rot}deg)`, opacity: 1, offset: .7 },
      { transform: `translate(${dx}px,${dy + 70}px) scale(.85) rotate(${rot * 1.4}deg)`, opacity: 0 },
    ], { duration, easing });
    a.onfinish = () => span.remove();
  }

  function burst(count, layer, accent, from) {
    const x = from ? from.x : window.innerWidth / 2, y = from ? from.y : window.innerHeight / 2;
    const reach = Math.max(window.innerWidth, window.innerHeight) * 0.55;
    for (let i = 0; i < count; i++) {
      const ang = rand() * Math.PI * 2;
      const dist = 80 + rand() * reach;
      flyHeart(x, y, 14 + rand() * 30, accent && rand() < 0.4 ? accent : pick(HEART_COLORS),
        Math.cos(ang) * dist, Math.sin(ang) * dist, (rand() - .5) * 140,
        1500 + rand() * 1000, "cubic-bezier(.12,.8,.3,1)", layer);
    }
  }

  function flash() {
    const f = document.createElement("span");
    f.className = "flash";
    fx.appendChild(f);
    if (!f.animate || reduce) { f.remove(); return; }
    f.animate([{ opacity: 0 }, { opacity: .85, offset: .15 }, { opacity: 0 }], { duration: 700, easing: "ease-out" })
      .onfinish = () => f.remove();
  }

  function puff(x, y, layer) {                  // a little "poof" where "Não" used to be
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + rand() * .5;
      flyHeart(x, y, 9 + rand() * 9, pick(HEART_COLORS), Math.cos(a) * (30 + rand() * 25), Math.sin(a) * (30 + rand() * 25),
        (rand() - .5) * 80, 650 + rand() * 250, "cubic-bezier(.2,.8,.3,1)", layer);
    }
  }
  function tapHearts(x, y) {
    const layer = splash.hidden ? fx : splashFx;   // over the question screen while it is up
    for (let i = 0; i < 3; i++) {
      flyHeart(x, y, 12 + rand() * 12, pick(HEART_COLORS),
        (rand() - .5) * 70, -50 - rand() * 60, (rand() - .5) * 60,
        900 + rand() * 400, "ease-out", layer);
    }
  }
  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest && e.target.closest(".card, .sheet")) return;
    tapHearts(e.clientX, e.clientY);
  });

  // ---------- sound ----------
  let ac = null;
  function audio() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ac = new AC();
      }
      if (ac && ac.state === "suspended") ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function tone(freq, dur, vol, type, when, endFreq) {
    if (!ac) return;
    try {
      const t = ac.currentTime + (when || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "triangle";
      o.frequency.setValueAtTime(freq, t);
      if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(ac.destination);
      o.start(t);
      o.stop(t + dur + 0.03);
    } catch (e) { /* no sound, no problem */ }
  }
  let noise = null;
  function clickSound(loud) {
    if (!ac) return;
    try {
      if (!noise) {
        const len = Math.floor(ac.sampleRate * 0.05);
        noise = ac.createBuffer(1, len, ac.sampleRate);
        const d = noise.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
      }
      const t = ac.currentTime;
      const src = ac.createBufferSource(), band = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise;
      band.type = "bandpass";
      band.frequency.value = loud ? 1800 : 2800;
      band.Q.value = 1.4;
      g.gain.value = loud ? 0.55 : 0.2;
      src.connect(band);
      band.connect(g);
      g.connect(ac.destination);
      src.start(t);
    } catch (e) { /* no sound, no problem */ }
  }
  const heartbeatSound = () => {
    tone(150, 0.15, 0.4, "sine", 0, 60);
    tone(300, 0.07, 0.07, "triangle", 0, 140);   // overtone so small speakers can play it
    tone(130, 0.15, 0.3, "sine", 0.22, 55);
    tone(260, 0.07, 0.05, "triangle", 0.22, 120);
  };
  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* not available */ }
  }
  const boing = () => { tone(620, .16, .07, "triangle", 0, 240); tone(900, .08, .03, "sine", .02, 500); };
  const winSound = () => [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, 0.6, 0.12, "sine", i * 0.13));

  // ---------- music ----------
  // No. 1 Party Anthem plays in the background from her first touch
  // (browsers only allow sound after a tap).
  const music = $("music");
  let musicOn = false, musicGain = null;

  // Route the song through Web Audio so it can be faded (iPhones ignore audio.volume).
  function connectMusic() {
    if (musicGain || !ac || location.protocol === "file:") return;
    try {
      const source = ac.createMediaElementSource(music);
      musicGain = ac.createGain();
      source.connect(musicGain);
      musicGain.connect(ac.destination);
    } catch (e) { musicGain = null; }
  }
  function musicLevel(level, seconds) {
    if (musicGain) {
      const t = ac.currentTime;
      musicGain.gain.cancelScheduledValues(t);
      musicGain.gain.setValueAtTime(musicGain.gain.value, t);
      musicGain.gain.linearRampToValueAtTime(level, t + seconds);
    } else {
      try { music.volume = level; } catch (e) { /* read-only on some phones */ }
    }
  }
  function startMusic() {
    if (musicOn) return;
    audio();
    connectMusic();
    const p = music.play();
    if (p && p.catch) p.catch(() => { /* not allowed yet: the next tap tries again */ });
  }
  music.addEventListener("playing", () => { musicOn = true; });
  music.addEventListener("pause", () => { musicOn = false; });
  let musicAllowed = false;                    // the song waits for her "Sim"
  function unlockAudio() {
    if (ac && ac.state !== "running") { try { ac.resume(); } catch (e) { /* try again next tap */ } }
    if (musicAllowed) startMusic();
  }
  ["pointerup", "touchend", "keydown"].forEach((type) => document.addEventListener(type, unlockAudio, true));
  let resumeOnReturn = false;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      resumeOnReturn = !music.paused;
      music.pause();
    } else if (resumeOnReturn) {
      const p = music.play();
      if (p && p.catch) p.catch(() => { /* the next tap brings it back */ });
    }
  });

  // ---------- spin ----------
  let rotation = 0;
  let spinning = false;
  let heartbeatTimer = null;
  let burstTimer = null;

  function setRotation(deg) {
    discSpin.style.transform = `rotate(${deg.toFixed(3)}deg)`;
  }
  function restaurantUnderPointer(deg) {
    return Math.floor(mod(-deg, 360) / SLICE);
  }

  function flickPointer() {
    if (!pointer.animate || reduce) return;
    pointer.animate([
      { transform: "translate(-50%,-42%) rotate(-18deg)" },
      { transform: "translate(-50%,-42%) rotate(0deg)" },
    ], { duration: 180, easing: "ease-out" });
  }

  // Choose the winner first (1 in 5 each), then pick where inside its slice the
  // pointer stops. Most spins end close to a divider, so it keeps you guessing
  // until the very last moment - without changing anyone's odds.
  function plan(from) {
    const k = randInt(N);
    const roll = rand();
    let f;
    if (roll < 0.4) f = 0.15 + 0.12 * rand();       // almost slips into the next one
    else if (roll < 0.8) f = 0.73 + 0.12 * rand();  // only just made it in
    else f = 0.35 + 0.3 * rand();
    const landing = k * SLICE + f * SLICE;
    const turns = reduce ? 2 : 7 + randInt(2);
    const to = from - mod(from, 360) + turns * 360 + mod(360 - landing, 360);
    return { k, to };
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    audio();
    closeResult(false);
    wheel.classList.remove("has-win");
    chipsBox.classList.remove("has-win");
    segs.forEach((s) => s.classList.remove("win"));
    chipEls.forEach((c) => c.classList.remove("win"));
    document.body.classList.add("suspense");
    startMusic();
    musicLevel(0.3, 1);
    spinBtn.disabled = true;
    spinLabel.textContent = "Girando…";
    live.textContent = "";

    const { to } = plan(rotation);
    const from = rotation;
    const BACK = reduce ? 0 : 12;                       // wind-up before the launch
    const WIND = reduce ? 0 : 900;
    const MAIN = reduce ? 3000 : 11000 + rand() * 2000;  // long, slow deceleration
    const OVER = reduce ? 0 : 2.5 + rand() * 1.5;       // tiny overshoot, stays inside the slice
    const SETTLE = reduce ? 0 : 1100;
    const TOTAL = WIND + MAIN + SETTLE;
    const start = performance.now();
    let prevRot = from, prevNow = start, crawling = false;

    function position(t) {
      if (t < WIND) return from - BACK * easeInOutSine(t / WIND);
      t -= WIND;
      if (t < MAIN) return (from - BACK) + (to + OVER - from + BACK) * easeOutCubic(t / MAIN);
      t -= MAIN;
      if (t < SETTLE) return to + OVER - OVER * easeInOutSine(t / SETTLE);
      return to;
    }

    function frame(now) {
      const t = Math.min(TOTAL, now - start);
      rotation = position(t);
      setRotation(rotation);

      if (Math.floor(rotation / PEG) !== Math.floor(prevRot / PEG)) {
        const divider = Math.floor(rotation / SLICE) !== Math.floor(prevRot / SLICE);
        clickSound(divider);
        if (divider) flickPointer();
        if (divider && crawling) buzz(12);
      }
      const speed = Math.abs(rotation - prevRot) / Math.max(1, now - prevNow) * 1000;
      if (!crawling && t > WIND + 1500 && speed < 70) {
        crawling = true;
        document.body.classList.add("crawl");
        spinLabel.textContent = "Será…?";
        musicLevel(0.1, 1.5);
        heartbeatSound();
        heartbeatTimer = setInterval(heartbeatSound, 850);
      }
      prevRot = rotation;
      prevNow = now;

      if (t < TOTAL) requestAnimationFrame(frame);
      else finish();
    }
    requestAnimationFrame(frame);
  }

  function finish() {
    rotation = rotation % 360;
    setRotation(rotation);
    const idx = restaurantUnderPointer(rotation);
    const r = active[idx];

    // one last breath before the reveal
    setTimeout(() => {
      clearInterval(heartbeatTimer);
      document.body.classList.remove("crawl", "suspense");
      segs[idx].classList.add("win");
      wheel.classList.add("has-win");
      chipEls[idx].classList.add("win");
      chipsBox.classList.add("has-win");
      spinning = false;
      spinBtn.disabled = false;
      spinLabel.textContent = "Girar";
      live.textContent = "Nosso jantar de 2 anos: " + r.name;

      flash();
      buzz([40, 60, 40, 60, 140]);
      musicLevel(1, 1.2);
      resultName.textContent = r.name;
      [...$("rowHearts").children].forEach((h, j) => {
        h.classList.toggle("win", j === idx);
        h.classList.toggle("faded", j !== idx);
      });
      resultName.style.setProperty("--seg-text", r.text);
      resultName.style.setProperty("--seg-soft", r.color + "33");
      result.hidden = false;
      document.body.classList.add("card-open");
      ok.focus();
      winSound();
      burst(reduce ? 18 : 80, resultFx, r.color);
      if (!reduce) burstTimer = setTimeout(() => burst(45, resultFx, r.color), 450);
    }, reduce ? 300 : 1000);
  }

  function closeResult(refocus) {
    if (result.hidden) return;
    result.hidden = true;
    clearTimeout(burstTimer);
    document.body.classList.remove("card-open");
    resultFx.textContent = "";
    if (refocus) spinBtn.focus();
  }

  // ---------- opening question: "Ama pichu?" ----------
  const splash = $("splash"), askCard = $("askCard"), askTitle = $("askTitle"), askSub = $("askSub");
  const yesBtn = $("yes"), noBtn = $("no"), splashFx = $("splashFx"), askPhoto = $("askPhoto");
  const NO_LABELS = ["Tem certeza?", "Pensa bem…", "Sério?", "O pichu vai chorar", "Última chance!", "Não vale!"];
  let answered = false, tries = 0, noX = 0, noY = 0, lastDodge = 0;
  main.inert = true;                           // keyboard focus stays on the question until she answers

  function placeNo(x, y, animate) {
    noX = x; noY = y;
    if (!animate) noBtn.style.transition = "none";
    noBtn.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    if (!animate) { void noBtn.offsetWidth; noBtn.style.transition = ""; }
  }
  // "Não" runs away to a random spot that never covers "Sim" or sits under her finger
  function dodge(px, py) {
    if (answered || noBtn.classList.contains("gone")) return;
    const now = performance.now();
    if (now - lastDodge < 250) return;       // one tap fires several events: move once
    lastDodge = now;
    tries++;
    const from = noBtn.getBoundingClientRect();
    if (!noBtn.classList.contains("running")) {
      noBtn.classList.add("running");
      splash.appendChild(noBtn);               // out of the card, so it can go anywhere
      placeNo(from.left, from.top, false);
    }
    puff(from.left + from.width / 2, from.top + from.height / 2, splashFx);
    audio();                                   // a tap: sound effects are allowed (the song still waits)
    boing();
    askPhoto.style.setProperty("--sad", String(Math.min(.9, tries * .2)));
    askPhoto.classList.remove("shake"); void askPhoto.getBoundingClientRect(); askPhoto.classList.add("shake");
    if (tries > NO_LABELS.length) {
      noBtn.classList.add("gone");
      askSub.textContent = "Só sobrou uma resposta!";
      yesBtn.style.scale = "1.6";
      burst(14, splashFx);
      return;
    }
    noBtn.textContent = NO_LABELS[tries - 1];
    yesBtn.style.scale = String(Math.min(1.55, 1 + tries * 0.1));
    const W = window.innerWidth, H = window.innerHeight, m = 14;
    const nb = { w: noBtn.offsetWidth, h: noBtn.offsetHeight };
    const yb = yesBtn.getBoundingClientRect(), cb = askCard.getBoundingClientRect();
    const clear = (x, y, r, pad) => x + nb.w < r.left - pad || x > r.right + pad || y + nb.h < r.top - pad || y > r.bottom + pad;
    let best = null, fallback = null;
    for (let i = 0; i < 60; i++) {
      const x = m + rand() * Math.max(0, W - nb.w - 2 * m);
      const y = m + rand() * Math.max(0, H - nb.h - 2 * m);
      if (!clear(x, y, yb, 16)) continue;                      // never on top of "Sim"
      const farFromFinger = Math.hypot(x + nb.w / 2 - px, y + nb.h / 2 - py) > 120;
      const farFromLast = Math.hypot(x - noX, y - noY) > 80;
      if (clear(x, y, cb, 6) && farFromFinger && farFromLast) { best = { x, y }; break; }   // outside the card: tidy
      if (!fallback && farFromFinger) fallback = { x, y };
    }
    best = best || fallback;
    if (best) placeNo(best.x, best.y, true);
    buzz(15);
  }
  noBtn.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") dodge(e.clientX, e.clientY); });
  noBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); dodge(e.clientX, e.clientY); });
  noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    const r = noBtn.getBoundingClientRect();
    dodge(r.left + r.width / 2, r.top + r.height / 2);   // keyboard, or a tap the pointer events missed
  });
  window.addEventListener("resize", () => {      // keep it on screen if the phone turns
    if (!noBtn.classList.contains("running")) return;
    const x = Math.min(noX, window.innerWidth - noBtn.offsetWidth - 14);
    const y = Math.min(noY, window.innerHeight - noBtn.offsetHeight - 14);
    placeNo(Math.max(14, x), Math.max(14, y), false);
  });

  yesBtn.addEventListener("click", () => {
    if (answered) return;
    answered = true;
    musicAllowed = true;
    unlockAudio();                               // this "Sim" is the tap that lets the song play
    const yb = yesBtn.getBoundingClientRect();
    askTitle.textContent = "Ah pichalã delícia";
    askTitle.classList.add("pop");
    askSub.textContent = "";
    askPhoto.style.setProperty("--sad", "0");   // colour comes back
    askCard.classList.add("said-yes");
    if (noBtn.classList.contains("running")) noBtn.classList.add("gone");
    else noBtn.hidden = true;                    // still in the row: drop it so "Sim" sits centred
    yesBtn.disabled = true;
    buzz([30, 50, 30]);
    burst(reduce ? 16 : 70, splashFx, null, { x: yb.left + yb.width / 2, y: yb.top + yb.height / 2 });
    if (!reduce) setTimeout(() => burst(30, splashFx), 250);
    setTimeout(() => {
      askCard.classList.add("leaving");
      splash.classList.add("opening");
      document.body.classList.add("open");       // starts the page's entrance
      main.inert = false;
      setTimeout(() => { splash.hidden = true; spinBtn.focus({ preventScroll: true }); }, reduce ? 60 : 700);
    }, reduce ? 300 : 1300);
  });

  // ---------- secret panel: press and hold the date for 1.5 s ----------
  const secret = $("secret"), secretList = $("secretList"), secretNote = $("secretNote"), secretDone = $("secretDone");
  const since = document.querySelector(".since");
  let holdTimer = null, holdFrom = null, switches = [];

  function renderSecret() {
    secretList.textContent = "";
    const on = new Set(active.map((r) => r.name));
    switches = RESTAURANTS.map((r, i) => {
      const li = document.createElement("li");
      const row = document.createElement("label");
      row.className = "secret-row" + (on.has(r.name) ? "" : " off");
      row.setAttribute("for", "sw-" + i);
      row.style.setProperty("--c", r.color);
      row.appendChild(heartSvg());
      const name = document.createElement("span");
      name.textContent = r.name;
      row.appendChild(name);
      const sw = document.createElement("input");
      sw.type = "checkbox";
      sw.className = "sw";
      sw.id = "sw-" + i;
      sw.checked = on.has(r.name);
      sw.addEventListener("change", () => {
        if (switches.filter((x) => x.checked).length < 2) {
          sw.checked = true;
          secretNote.textContent = "A roleta precisa de pelo menos 2.";
        } else {
          secretNote.textContent = "";
        }
        row.classList.toggle("off", !sw.checked);
      });
      row.appendChild(sw);
      li.appendChild(row);
      secretList.appendChild(li);
      return sw;
    });
  }
  function openSecret() {
    if (spinning) return;
    closeResult(false);
    renderSecret();
    secretNote.textContent = "";
    secretDone.disabled = false;
    secret.hidden = false;
    buzz(30);
    secretDone.focus();
  }
  function closeSecret() {
    secret.hidden = true;
    spinBtn.focus();
  }

  // Save for everyone: republish this page with the new list (works for the owner in claude.ai).
  async function publishForEveryone(cfg) {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return false;
      const art = await window.claude.use("artifact");
      if (!art) return false;
      const res = await fetch("pagina.txt", { cache: "no-store" });
      if (!res.ok) return false;
      let src = await res.text();
      const block = /(<script type="application\/json" id="wheelConfig">)[\s\S]*?(<\/script>)/;
      if (!/^\s*<!doctype html/i.test(src) || !block.test(src)) return false;
      src = src.replace(block, (m, open, close) => open + JSON.stringify(cfg) + close);
      await art.publish(src);   // every open view, this one too, reloads with the new list
      return true;
    } catch (e) {
      return false;
    }
  }

  secretDone.addEventListener("click", async () => {
    const removed = RESTAURANTS.filter((r, i) => !switches[i].checked).map((r) => r.name);
    const before = RESTAURANTS.filter((r) => !active.includes(r)).map((r) => r.name);
    if (removed.join() === before.join()) { closeSecret(); return; }
    const cfg = { removed, ts: Date.now() };
    applyConfig(cfg);
    fitWheel();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) { /* this view only */ }
    secretDone.disabled = true;
    secretNote.textContent = "Salvando…";
    const everyone = await publishForEveryone(cfg);
    secretNote.textContent = everyone ? "Pronto! Vale para quem abrir o link." : "Pronto! Salvo neste aparelho.";
    setTimeout(closeSecret, everyone ? 2500 : 1200);
  });
  secret.addEventListener("click", (e) => { if (e.target === secret) closeSecret(); });

  since.addEventListener("pointerdown", (e) => {
    holdFrom = { x: e.clientX, y: e.clientY };
    clearTimeout(holdTimer);
    holdTimer = setTimeout(openSecret, 1500);
  });
  const cancelHold = () => { clearTimeout(holdTimer); holdFrom = null; };
  ["pointerup", "pointerleave", "pointercancel"].forEach((type) => since.addEventListener(type, cancelHold));
  since.addEventListener("pointermove", (e) => {
    if (holdFrom && Math.hypot(e.clientX - holdFrom.x, e.clientY - holdFrom.y) > 12) cancelHold();
  });
  since.addEventListener("contextmenu", (e) => e.preventDefault());

  spinBtn.addEventListener("click", spin);
  wheelWrap.addEventListener("click", spin);
  ok.addEventListener("click", () => { closeResult(true); burst(reduce ? 10 : 30); });
  result.addEventListener("click", (e) => { if (e.target === result) closeResult(true); });
  document.addEventListener("keydown", (e) => {
    if (!secret.hidden) {
      if (e.key === "Escape") closeSecret();
      return;
    }
    if (result.hidden) return;
    if (e.key === "Escape") closeResult(true);
    if (e.key === "Tab") { e.preventDefault(); ok.focus(); }   // keep focus inside the card
  });
})();
</script>
</body>
</html>
