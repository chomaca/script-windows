<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bancada 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="app">
  <main class="palco" id="palco" aria-label="Visualização 3D da montagem">
    <div class="vista" id="vista"></div>
    <div class="hud hud-topo">
      <div class="grupo-vistas" role="group" aria-label="Ângulo da câmera">
        <button type="button" data-vista="iso" aria-pressed="true">3D</button>
        <button type="button" data-vista="vidro">Lateral</button>
        <button type="button" data-vista="frente">Frente</button>
        <button type="button" data-vista="traseira">Traseira</button>
        <button type="button" data-vista="topo">Topo</button>
      </div>
      <div class="grupo-camadas" role="group" aria-label="Camadas">
        <button type="button" data-vis="paineis" aria-pressed="true">Painéis</button>
        <button type="button" data-vis="vidro" aria-pressed="true">Vidro</button>
        <button type="button" data-vis="fluxo" aria-pressed="false">Fluxo de ar</button>
        <button type="button" data-vis="cotas" aria-pressed="true">Cotas</button>
        <button type="button" data-vis="girar" aria-pressed="true">Girar fans</button>
        <label class="explodir"><span>Explodir</span><input type="range" id="explodir" min="0" max="1" step="0.01" value="0"></label>
        <button type="button" id="capturar">Imagem</button>
      </div>
    </div>
    <div class="dica" id="dica">Arraste para girar · role para aproximar · clique numa peça para ver as medidas</div>
    <div class="legenda-fluxo" id="legenda-fluxo" hidden><span class="lf lf-entrada">Entrada de ar</span><span class="lf lf-saida">Saída de ar</span></div>
    <div class="tooltip" id="tooltip" hidden></div>
    <aside class="ficha" id="ficha" hidden aria-live="polite"></aside>
    <div class="carregando" id="carregando"><span class="regua" aria-hidden="true"></span><p id="carregando-texto">Carregando o motor 3D…</p></div>
  </main>

  <aside class="bancada" aria-label="Configuração da montagem">
    <header class="cabecalho">
      <div class="marca">
        <h1>Bancada 3D</h1>
        <p id="sub-gabinete">Montagem em escala 1 : 1, medidas em mm</p>
      </div>
      <div id="status-geral" class="status"></div>
    </header>
    <nav class="abas" role="tablist" aria-label="Seções">
      <button type="button" role="tab" id="tab-pecas" data-aba="pecas" aria-selected="true">Peças</button>
      <button type="button" role="tab" id="tab-fans" data-aba="fans" aria-selected="false">Fans</button>
      <button type="button" role="tab" id="tab-checagem" data-aba="checagem" aria-selected="false">Checagem</button>
      <button type="button" role="tab" id="tab-medidas" data-aba="medidas" aria-selected="false">Medidas e fontes</button>
    </nav>
    <div class="conteudo" id="conteudo" role="tabpanel"></div>
  </aside>
</div>

<div class="modal" id="modal-imagem" hidden role="dialog" aria-modal="true" aria-labelledby="modal-imagem-titulo">
  <div class="modal-caixa">
    <header><h2 id="modal-imagem-titulo">Imagem da montagem</h2><button type="button" class="fechar" data-fechar-modal aria-label="Fechar">×</button></header>
    <img id="modal-imagem-img" alt="Captura da montagem 3D">
    <footer><a id="modal-imagem-baixar" class="botao botao-forte" download="bancada-3d.png" href="#">Baixar PNG</a><span class="nota">Se o download não começar, clique com o botão direito na imagem e salve.</span></footer>
  </div>
</div>

<script src="data/catalogo.js"></script>
<script src="data/build-padrao.js"></script>
<script src="js/modelos3d.js"></script>
<script src="js/montagem.js"></script>
<script src="js/verificacao.js"></script>
<script src="js/app.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
try {
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const { CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js');
  window.PCBApp.iniciar({ THREE, OrbitControls, RoomEnvironment, CSS2DRenderer, CSS2DObject });
} catch (erro) {
  window.PCBApp.falha(erro);
}
</script>
</body>
</html>
